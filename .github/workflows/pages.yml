name: Website

# Publishes the project website (site/) to GitHub Pages:
# https://bugraskl.github.io/eye-tracker/
# The download buttons are filled in from the latest GitHub release at build
# time, so the site is rebuilt for every release: release.yml starts this
# workflow after publishing (a release created with the workflow token triggers
# nothing by itself), and "release: published" covers releases made by hand.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "assets/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a queued run waits instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked build dependencies
        run: uv sync --locked --group build --no-dev

      - name: Read the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Before the first release the API answers 404; the site then links
          # to the releases page instead of individual downloads. Anything else
          # (auth, rate limit, 5xx) is retried once and then fails the build.
          for attempt in 1 2; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > release.json 2> gh-error.txt; then
              exit 0
            fi
            if grep -q "HTTP 404" gh-error.txt; then
              echo "No release yet; the site will link to the releases page."
              echo '{}' > release.json
              exit 0
            fi
            echo "::warning::reading the latest release failed (attempt ${attempt})"
            if [[ "${attempt}" == 2 ]]; then
              cat gh-error.txt >&2
              echo "::error::cannot read the latest release (not a 404)"
              exit 1
            fi
            sleep 5
          done

      - name: Build
        run: uv run --no-sync python scripts/build_site.py --release release.json --out _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
